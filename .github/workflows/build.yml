name: Build VST3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: JustAnAmp-Windows-VST3
          - os: macos-latest
            name: JustAnAmp-macOS-VST3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/JustAnAmp_artefacts/**/VST3
          if-no-files-found: error
